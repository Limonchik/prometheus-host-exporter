---
- name: Install required packages
  dnf:
    name:
      - python3
      - python3-pip
      - git
    state: present

- name: Create application directory
  file:
    path: /opt/prometheus-exporter
    state: directory
    mode: '0755'

- name: Copy application files
  copy:
    src: "{{ item }}"
    dest: /opt/prometheus-exporter/
  with_items:
    - "../../app/app.py"
    - "../../app/requirements.txt"

- name: Install Python requirements
  pip:
    requirements: /opt/prometheus-exporter/requirements.txt
    executable: pip3

- name: Create systemd service file
  template:
    src: prometheus_exporter.service.j2
    dest: /etc/systemd/system/prometheus_exporter.service
    mode: '0644'

- name: Enable and start Prometheus exporter service
  systemd:
    name: prometheus_exporter
    enabled: yes
    state: started
    daemon_reload: yes